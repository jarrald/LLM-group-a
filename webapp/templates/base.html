<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Local Multi-LLM Workflow{% endblock %}</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --warn:#eab308; --bad:#ef4444; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 1000px; margin:0 auto; padding:24px 20px 60px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  h2 { font-size:1.1rem; margin:24px 0 8px; }
  a { color:var(--accent); }
  .muted { color:var(--muted); font-size:.9rem; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:12px; }
  textarea { width:100%; min-height:120px; padding:12px; border-radius:8px; border:1px solid var(--border); background:#0b1220; color:var(--text); font:inherit; }
  button { margin-top:10px; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#082f49; font-weight:600; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:.78rem; font-weight:600; }
  .ok, .completed { background:rgba(34,197,94,.15); color:var(--ok); }
  .warn, .degraded, .completed_with_failures { background:rgba(234,179,8,.15); color:var(--warn); }
  .bad, .down, .failed { background:rgba(239,68,68,.15); color:var(--bad); }
  .running { background:rgba(56,189,248,.15); color:var(--accent); }
  .pending, .skipped, .unknown { background:rgba(148,163,184,.15); color:var(--muted); }
  pre { white-space:pre-wrap; background:#0b1220; border:1px solid var(--border); border-radius:8px; padding:12px; overflow:auto; }
  code { font-family:ui-monospace, monospace; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  ul { margin:8px 0 0; padding-left:20px; }
  @media (max-width:760px){ .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
{% block body %}{% endblock %}
</div>
</body>
</html>
