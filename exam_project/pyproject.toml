[project]
name = "studygraph"
version = "0.1.0"
description = "StudyGraph — a local LLM study assistant with RAG-grounded course answers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.66,<2",
    "chromadb>=1.5,<2",
    "langgraph>=1.2,<2",
    "ollama>=0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "pandas>=3.1.1",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
conversion = [
    "imageio-ffmpeg>=0.6,<1",
    "pymupdf>=1.26,<2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    # The regression comparison (Phase 8) is developed in the same checkout, so the
    # default `uv sync` also installs its dependencies (ADR-021).
    { include-group = "regression" },
    { include-group = "notebook" },
]
# Not used by the app; only by regression/*.ipynb (ADR-021).
regression = [
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.3,<2",
    "pandas>=2.1",
]
# Kernel for Jupyter/VS Code notebooks. Declared so `uv sync` does not prune it (ADR-021).
notebook = [
    "ipykernel>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requires a live Chroma server and/or Ollama (excluded by default)",
]

[tool.ruff]
line-length = 240
target-version = "py312"
# Course material (docs/RAG) and the design exports are not our source code.
# regression/scikit-learn-main is a third-party checkout: lint it with upstream's rules,
# not ours. regression/.chroma, regression/out and regression/runs hold generated files, and
# regression/*.ipynb is a scratchpad that is edited live (ADR-021, ADR-022). The hidden
# ".scikit-learn-main.download" directory is fetch_corpus.py's staging area (ADR-024).
extend-exclude = [".venv", "docs", "Designs", "data", "regression/scikit-learn-main", "regression/.scikit-learn-main.download", "regression/.chroma", "regression/out", "regression/runs", "regression/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# A notebook imports names in one cell to use them in later ones, so "unused import"
# and import ordering are not meaningful there (ADR-021).
"**/*.ipynb" = ["F401", "I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["\\.venv"]
