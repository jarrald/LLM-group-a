[project]
name = "studygraph"
version = "0.1.0"
description = "StudyGraph — a local LLM study assistant with RAG-grounded course answers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.66,<2",
    "chromadb>=1.5,<2",
    "langgraph>=1.2,<2",
    "ollama>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requires a live Chroma server and/or Ollama (excluded by default)",
]

[tool.ruff]
line-length = 240
target-version = "py312"
# Course material (docs/RAG) and the design exports are not our source code.
extend-exclude = [".venv", "docs", "Designs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["\\.venv"]
